name: always-on-dashboard

# متوقف — التحديث الحي أصبح على VPS.
# الإبقاء على workflow_dispatch فقط للطوارئ اليدوية.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "tick | premarket | evening (يدوي فقط — الجدول متوقف)"
        required: true
        default: "tick"

concurrency:
  group: always-on-dashboard
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Notice
        run: |
          echo "always-on schedule is disabled — live updates run on the VPS."
          echo "This manual dispatch still works for emergencies."
