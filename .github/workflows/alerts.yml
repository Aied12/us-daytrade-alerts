name: us-daytrade-alerts

# المهام الثقيلة فقط (يدوي أو مرة عند الافتتاح/الإغلاق)
# التحديث المستمر انتقل إلى always-on.yml لتجنب التعارض
on:
  schedule:
    - cron: "0 8 * * 1-5"
    - cron: "5 20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "premarket | tick | evening | intel | ping"
        required: true
        default: "tick"

concurrency:
  group: always-on-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Write secrets to .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
          CAPITAL_SAR: ${{ secrets.CAPITAL_SAR }}
        run: |
          printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN" > .env
          printf 'TELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_CHAT_ID" >> .env
          printf 'TELEGRAM_CHANNEL_ID=%s\n' "$TELEGRAM_CHANNEL_ID" >> .env
          printf 'TELEGRAM_EXTRA_CHAT_IDS=%s\n' "$TELEGRAM_EXTRA_CHAT_IDS" >> .env
          printf 'CAPITAL_SAR=%s\n' "${CAPITAL_SAR:-45000}" >> .env
          printf 'LIGHT_MODE=1\nAPI_THRIFT=1\nUSER_MODE=beginner\nMIN_PRICE_USD=5\nTIMEZONE=Asia/Riyadh\n' >> .env
          if [ -f data/telegram_paused ]; then
            printf 'TELEGRAM_ENABLED=0\n' >> .env
          else
            printf 'TELEGRAM_ENABLED=0\n' >> .env
          fi
      - name: Run bot job + rebuild dashboard
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "08" ]; then MODE=premarket
            elif [ "$HOUR" = "20" ]; then MODE=evening
            else MODE=tick
            fi
          fi
          if [ "$MODE" = "ping" ]; then
            python scripts/telegram_ping.py || true
          else
            python scripts/scheduled_run.py --mode "$MODE" --force || true
          fi
          python scripts/write_live_json.py || true
          python scripts/publish_news.py || true
          python scripts/build_pages.py
          cp -f pages/index.html docs/index.html
          cp -f pages/status.json docs/status.json
          cp -f pages/prices-live.json docs/prices-live.json 2>/dev/null || true
          cp -f pages/live.json docs/live.json 2>/dev/null || true
          cp -f pages/news-live.json docs/news-live.json 2>/dev/null || true
          mkdir -p docs/icons
          cp -f pages/manifest.webmanifest docs/manifest.webmanifest 2>/dev/null || true
          cp -f pages/sw.js docs/sw.js 2>/dev/null || true
          cp -f pages/icons/*.png docs/icons/ 2>/dev/null || true
      - name: Commit docs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ pages/status.json pages/index.html pages/prices-live.json pages/live.json pages/news-live.json \
            pages/manifest.webmanifest pages/sw.js pages/icons data/sniper_seen.json || true
          if git diff --cached --quiet; then
            echo "[publish] no dashboard changes"
            exit 0
          fi
          git commit -m "Auto-update dashboard (Actions)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || git rebase --abort || true
            if git push origin HEAD:main; then
              echo "[publish] pushed"
              exit 0
            fi
            sleep 5
          done
          exit 1
