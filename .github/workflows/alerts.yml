name: us-daytrade-alerts

on:
  schedule:
    # Premarket ≈ 11:00 السعودية (08:00 UTC)
    - cron: "0 8 * * 1-5"
    # أثناء الجلسة كل 10 دقائق 11ص–11م السعودية (08–20 UTC)
    - cron: "*/10 8-20 * * 1-5"
    # ملخص مسائي ≈ 23:05 السعودية
    - cron: "5 20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "premarket | tick | evening | intel | ping"
        required: true
        default: "tick"
  # لا تشغّل البوت الثقيل على كل push — يكفي الجدولة + يدوي
  # (النشر من الجهاز المحلي/الـ watchdog يدفع docs/ مباشرة)

permissions:
  contents: write

jobs:
  run-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Write secrets to .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
          CAPITAL_SAR: ${{ secrets.CAPITAL_SAR }}
        run: |
          printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN" > .env
          printf 'TELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_CHAT_ID" >> .env
          printf 'TELEGRAM_CHANNEL_ID=%s\n' "$TELEGRAM_CHANNEL_ID" >> .env
          printf 'TELEGRAM_EXTRA_CHAT_IDS=%s\n' "$TELEGRAM_EXTRA_CHAT_IDS" >> .env
          printf 'CAPITAL_SAR=%s\n' "${CAPITAL_SAR:-45000}" >> .env
          printf 'LIGHT_MODE=1\nAPI_THRIFT=1\nUSER_MODE=beginner\nMIN_PRICE_USD=5\nTIMEZONE=Asia/Riyadh\n' >> .env
          # احترام ملف الإيقاف المؤقت إن وُجد في المستودع
          if [ -f data/telegram_paused ]; then
            printf 'TELEGRAM_ENABLED=0\n' >> .env
            echo "[telegram] paused via data/telegram_paused"
          else
            printf 'TELEGRAM_ENABLED=1\n' >> .env
          fi
      - name: Run bot job + rebuild dashboard
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "08" ] && [ "$(date -u +%M)" = "00" ]; then MODE=premarket
            elif [ "$HOUR" = "20" ]; then MODE=evening
            else MODE=tick
            fi
          fi
          if [ "$MODE" = "ping" ]; then
            python scripts/telegram_ping.py || true
          else
            python scripts/scheduled_run.py --mode "$MODE" --force || true
          fi
          python scripts/build_pages.py
          python scripts/write_live_json.py || true
          cp -f pages/index.html docs/index.html
          cp -f pages/status.json docs/status.json
          cp -f pages/prices-live.json docs/prices-live.json 2>/dev/null || true
          cp -f pages/live.json docs/live.json 2>/dev/null || true
      - name: Commit docs to main (GitHub Pages source)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/status.json docs/prices-live.json docs/live.json \
                  pages/index.html pages/status.json pages/prices-live.json pages/live.json \
                  data/sniper_seen.json || true
          if git diff --cached --quiet; then
            echo "[publish] no dashboard changes"
            exit 0
          fi
          git commit -m "Auto-update dashboard (Actions)"
          git push origin HEAD:main
