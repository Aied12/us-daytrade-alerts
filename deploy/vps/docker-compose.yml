# تشغيل كامل على VPS: فحص + صفحة + HTTPS + إشعارات
# الاستخدام:
#   cd /opt/us-daytrade-alerts/deploy/vps
#   DOMAIN=daytrade.2.28.129.241.sslip.io docker compose up -d --build

services:
  bot:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      VPS_CYCLE_SEC: ${VPS_CYCLE_SEC:-45}
      VPS_PUSH_EVERY: ${VPS_PUSH_EVERY:-0}
      LIVE_API_URL: ${LIVE_API_URL:-}
      LIVE_API_TOKEN: ${LIVE_API_TOKEN:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:daytrade@localhost}
      NEWS_TRANSLATE_BUDGET: ${NEWS_TRANSLATE_BUDGET:-15}
      NEWS_USE_ARGOS: ${NEWS_USE_ARGOS:-0}
    volumes:
      - ../../data:/app/data
      - ../../docs:/app/docs
      - ../../pages:/app/pages
      - ../../logs:/app/logs
      - ../../.env:/app/.env:ro
    working_dir: /app
    command: ["python", "scripts/vps_loop.py"]

  api:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      PUSH_API_PORT: "5055"
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:daytrade@localhost}
    volumes:
      - ../../data:/app/data
      - ../../.env:/app/.env:ro
    working_dir: /app
    command: ["python", "scripts/push_api.py"]
    expose:
      - "5055"

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../../docs:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    depends_on:
      - bot

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-daytrade.2.28.129.241.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  caddy_data:
  caddy_config:
